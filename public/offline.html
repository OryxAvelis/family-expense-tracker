<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#087f64" />
    <title>Hors connexion · Dépenses famille</title>
    <style>
      :root { color-scheme: light dark; font-family: Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f3f8f6; color: #14231f; }
      main { width: min(100%, 390px); padding: 32px 24px; text-align: center; border: 1px solid #d3e0dc; border-radius: 28px; background: #fff; box-shadow: 0 24px 70px rgba(8, 55, 44, .12); }
      img { width: 88px; height: 88px; border-radius: 24px; }
      h1 { margin: 22px 0 8px; font-size: 26px; }
      p { margin: 0 0 24px; color: #64756f; line-height: 1.55; }
      button { min-height: 48px; width: 100%; border: 0; border-radius: 14px; background: #087f64; color: white; font: inherit; font-weight: 700; cursor: pointer; }
      @media (prefers-color-scheme: dark) {
        body { background: #08121a; color: #f4f7f5; }
        main { background: #101c25; border-color: #20313c; }
        p { color: #98a8b2; }
        button { background: #40e0b1; color: #06130f; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Vous êtes hors connexion</h1>
      <p>Reconnectez-vous à Internet pour consulter les commandes et les produits à jour.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
